# Installed by the community.camilladsp Omarchy plugin as
# ~/.config/wireplumber/wireplumber.conf.d/60-omarchy-camilladsp.conf
#
# CamillaDSP's two streams must only ever connect where they were sent. If the
# CamillaDSP sink disappears, WirePlumber would otherwise reconnect the capture
# stream to the default output's monitor, and if the real output disappears it
# would send the processed audio into the default output, which is the CamillaDSP
# sink itself. Either way the DSP ends up listening to its own output: a feedback
# loop. Staying unconnected is silent and safe; turning CamillaDSP on again
# reconnects it to the current output.
stream.rules = [
  {
    matches = [
      { node.name = "camilladsp-capture" }
      { node.name = "camilladsp-playback" }
    ]
    actions = {
      update-props = {
        node.dont-fallback = true
        node.dont-reconnect = true
      }
    }
  }
]

title: Vocal clarity
description: Trims the low-mid mud and lifts presence. Good for podcasts and calls.
filters:
  preamp:
    type: Gain
    parameters:
      gain: -3.0
  mud:
    type: Biquad
    parameters:
      type: Peaking
      freq: 250
      gain: -2.5
      q: 1.0
  presence:
    type: Biquad
    parameters:
      type: Peaking
      freq: 3000
      gain: 3.0
      q: 0.9
pipeline:
  - type: Filter
    names: [preamp, mud, presence]
